<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request a Consultation | Archangel Executive Solutions</title>
<meta name="description" content="Request a confidential consultation with Archangel Executive Solutions.">
<link rel="icon" href="assets/logomark-teal.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/clear-sans@5/400.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/clear-sans@5/500.css" rel="stylesheet">
<link href="styles.css" rel="stylesheet">
<style>
  main { min-height: calc(100svh - var(--header-h) - var(--footer-h)); display: flex; align-items: center; padding: clamp(48px, 8vh, 96px) 0; }
  .grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: clamp(40px, 7vw, 120px); align-items: start; }
  h1 { font-size: clamp(36px, 4vw, 58px); }
  .lead { color: var(--muted); margin: 20px 0 0; max-width: 40ch; }
  .back { display: inline-block; margin-top: 32px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; text-decoration: none; color: var(--muted); }
  .back:hover { color: var(--teal); }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 28px; }
  .full { grid-column: 1 / -1; }
  label { display: block; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; margin-bottom: 6px; }
  input, textarea { width: 100%; font: inherit; font-size: 16px; color: var(--teal); background: transparent; border: 0; border-bottom: 1px solid rgba(8, 51, 53, .35); border-radius: 0; padding: 10px 0; outline: none; }
  input:focus, textarea:focus { border-bottom-color: var(--teal); }
  textarea { min-height: 120px; resize: vertical; }
  .note { font-size: 13px; color: var(--muted); margin: 0; }
  .status { font-size: 14px; margin: 0; min-height: 1em; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  @media (max-width: 560px) { form { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap bar">
    <a href="/" class="mark" aria-label="Archangel Executive Solutions home"><img src="assets/logomark-teal.svg" alt="Archangel Executive Solutions"></a>
  </div>
</header>

<main>
  <div class="wrap grid">
    <div>
      <h1>Request a Consultation</h1>
      <p class="lead">Tell us a little about what you need. A member of our team will respond within one business day.</p>
      <a class="back" href="/">&larr; Back to home</a>
    </div>
    <form id="inquiry" novalidate>
      <div><label for="f-name">Name</label><input id="f-name" name="name" autocomplete="name" required></div>
      <div><label for="f-org">Organization</label><input id="f-org" name="organization" autocomplete="organization"></div>
      <div><label for="f-email">Email</label><input id="f-email" name="email" type="email" autocomplete="email" required></div>
      <div><label for="f-phone">Phone</label><input id="f-phone" name="phone" type="tel" autocomplete="tel"></div>
      <div class="full"><label for="f-msg">How can we help?</label><textarea id="f-msg" name="message"></textarea></div>
      <div class="full"><button class="btn btn-dark" type="submit">Send Inquiry</button></div>
      <p class="full note">Please do not include sensitive itinerary details in this form. We will arrange a secure channel.</p>
      <p class="full status" id="form-status" role="status"></p>
    </form>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">&copy; <span id="yr">2026</span> Archangel Executive Solutions LLC</div>
</footer>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  // Placeholder: opens the visitor's mail client. Swap for a form backend once company email is live.
  var TO = 'info@archangelexecutive.com';
  document.getElementById('inquiry').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, status = document.getElementById('form-status');
    if (!f.name.value.trim() || !f.email.value.trim()) { status.textContent = 'Please add your name and email.'; return; }
    var body = 'Name: ' + f.name.value + '\nOrganization: ' + f.organization.value + '\nEmail: ' + f.email.value +
      '\nPhone: ' + f.phone.value + '\n\n' + f.message.value;
    window.location.href = 'mailto:' + TO + '?subject=' + encodeURIComponent('Consultation request: ' + f.name.value) + '&body=' + encodeURIComponent(body);
    status.textContent = 'Opening your email client to send the inquiry.';
  });
</script>
</body>
</html>
