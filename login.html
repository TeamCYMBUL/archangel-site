<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Login | Archangel Executive Solutions</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logomark-teal.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/clear-sans@5/400.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/clear-sans@5/500.css" rel="stylesheet">
<link href="styles.css?v=3" rel="stylesheet">
<style>
  main { min-height: calc(100svh - var(--header-h) - var(--footer-h)); display: flex; align-items: center; justify-content: center; padding: clamp(40px, 8vh, 96px) 0; }
  .card { width: 100%; max-width: 440px; }
  .card img { height: 56px; width: auto; display: block; margin: 0 auto 28px; }
  h1 { font-size: clamp(32px, 3.4vw, 46px); text-align: center; }
  .lead { text-align: center; color: var(--muted); margin: 12px 0 36px; }
  form { display: grid; gap: 24px; }
  label { display: block; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; margin-bottom: 6px; }
  input { width: 100%; font: inherit; font-size: 16px; color: var(--teal); background: transparent; border: 0; border-bottom: 1px solid rgba(8, 51, 53, .35); border-radius: 0; padding: 10px 0; outline: none; }
  input:focus { border-bottom-color: var(--teal); }
  .btn { width: 100%; text-align: center; }
  .row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .row a { color: var(--muted); }
  .status { font-size: 14px; text-align: center; margin: 0; min-height: 1.4em; }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap bar">
    <a href="/" class="mark" aria-label="Archangel home"><img src="assets/logo-wordmark-teal.svg" alt="Archangel"></a>
    <a href="/consultation" class="login">Request a Consultation</a>
  </div>
</header>

<main>
  <div class="wrap card">
    <img src="assets/logomark-teal.svg" alt="">
    <h1>Client Login</h1>
    <p class="lead">Secure access for Archangel clients.</p>
    <!-- Placeholder only: the portal is not live yet. Nothing typed here is sent or stored. -->
    <form id="login" novalidate autocomplete="off">
      <div><label for="f-email">Email</label><input id="f-email" name="email" type="email" autocomplete="off"></div>
      <div><label for="f-pass">Password</label><input id="f-pass" name="password" type="password" autocomplete="off"></div>
      <div class="row"><span></span><a href="/consultation">Need access?</a></div>
      <button class="btn btn-dark" type="submit">Sign In</button>
      <p class="status" id="status" role="status"></p>
    </form>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">&copy; <span id="yr">2026</span> Archangel Executive Solutions LLC</div>
</footer>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  document.getElementById('login').addEventListener('submit', function (e) {
    e.preventDefault();
    e.target.reset();
    document.getElementById('status').textContent = 'The client portal is coming soon. Please contact your Archangel representative.';
  });
</script>
</body>
</html>
