<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archangel Executive Solutions</title>
<meta name="description" content="Archangel Executive Solutions. Solutions architected to protect your peace of mind.">
<link rel="icon" href="assets/logomark-teal.svg" type="image/svg+xml">
<link rel="preload" as="image" href="assets/hero-city-poster.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Le Jour Serif is the brand primary font (commercial license). Cormorant Garamond stands in until a webfont license is purchased. -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/clear-sans@5/400.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/clear-sans@5/500.css" rel="stylesheet">
<link href="styles.css?v=3" rel="stylesheet">
<style>
  .hero { position: relative; height: calc(100svh - var(--header-h) - var(--footer-h)); min-height: 300px; overflow: hidden; background: #041a1b url(assets/hero-city-poster.jpg) center / cover no-repeat; }
  .hero video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4,26,27,.15) 0%, rgba(4,26,27,0) 35%, rgba(4,26,27,.7) 100%), linear-gradient(90deg, rgba(4,26,27,.55) 0%, rgba(4,26,27,.15) 50%, rgba(4,26,27,0) 75%); pointer-events: none; }
  .hero-copy { position: absolute; z-index: 2; left: 0; right: 0; bottom: clamp(40px, 9vh, 96px); }
  .hero-copy h1 { color: var(--cream); font-size: clamp(32px, 4.4vw, 88px); max-width: 22ch; text-wrap: balance; text-shadow: 0 1px 24px rgba(0,0,0,.25); }
  .hero-copy .btn { margin-top: 32px; }
  @media (max-height: 520px) {
    .hero { min-height: 0; }
    .hero-copy { bottom: 24px; }
    .hero-copy h1 { font-size: clamp(26px, 7vh, 40px); max-width: 26ch; }
    .hero-copy .btn { margin-top: 16px; }
  }
  @media (max-width: 360px) { .hero-copy h1 { font-size: 29px; } }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap bar">
    <a href="/" class="mark" aria-label="Archangel home"><img src="assets/logo-wordmark-teal.svg" alt="Archangel"></a>
    <a href="/login" class="login">Client Login</a>
  </div>
</header>

<main>
  <section class="hero" aria-label="Archangel Executive Solutions">
    <video id="hero-video" autoplay muted loop playsinline preload="auto" poster="assets/hero-city-poster.jpg" aria-hidden="true"></video>
    <div class="hero-copy">
      <div class="wrap">
        <h1>Solutions architected to protect your peace of mind.</h1>
        <a class="btn btn-light" href="/consultation">Request a Consultation</a>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">&copy; <span id="yr">2026</span> Archangel Executive Solutions LLC</div>
</footer>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  (function () {
    var v = document.getElementById('hero-video');
    // Respect reduced-motion: keep the still poster instead of playing the video.
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { v.removeAttribute('autoplay'); return; }
    // Smaller file for phones and small tablets.
    v.src = 'assets/' + (Math.max(screen.width, screen.height) * (window.devicePixelRatio || 1) < 1800 || window.innerWidth < 900 ? 'hero-reel-720.mp4' : 'hero-reel.mp4');
    v.muted = true;
    var seek = new URLSearchParams(location.search).get('t'); // QA: ?t=SECONDS freezes the reel at that moment
    if (seek !== null) { v.removeAttribute('autoplay'); var go = function () { v.currentTime = +seek; }; if (v.readyState >= 1) go(); else v.addEventListener('loadedmetadata', go, { once: true }); return; }
    function play() { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
    play();
    // Browsers hold back autoplay in background tabs; start as soon as the page is visible.
    document.addEventListener('visibilitychange', function () { if (!document.hidden) play(); });
  })();
</script>
</body>
</html>
